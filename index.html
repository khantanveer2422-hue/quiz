<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <header class="brand">
            <p class="eyebrow">Professional Assessment</p>
            <h1>Code With AI Quiz</h1>
            <span class="gold-rule" aria-hidden="true"></span>
        </header>

        <section id="quiz" class="quiz-card">
            <h2 id="question"></h2>
            <div id="options"></div>
        </section>

        <p id="result"></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
